name: Build Multi-Arch Native Libraries

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build-amd64:
    name: Build Ubuntu amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            libcurl4-openssl-dev \
            libapr1-dev \
            libaprutil1-dev \
            libboost-all-dev

      - name: Build jsoncpp
        run: |
          mkdir -p jsoncpp-build
          cd jsoncpp-build
          git clone https://github.com/open-source-parsers/jsoncpp.git . || true
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DJSONCPP_WITH_TESTS=OFF \
                -DJSONCPP_WITH_EXAMPLE=OFF \
                ..
          make -j$(nproc) || true
          mkdir -p ../../bin/lib ../../bin/include/jsoncpp
          find . -name "libjsoncpp.a" -exec cp {} ../../bin/lib/ \; 2>/dev/null || true
          find ../include -name "*.h" -exec cp {} ../../bin/include/jsoncpp/ \; 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build

      - name: Configure with CMake (amd64)
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_ROCKETMQ_SHARED=ON \
                -DBUILD_ROCKETMQ_STATIC=OFF \
                -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -fPIC" \
                -DCMAKE_C_FLAGS="-O3 -DNDEBUG -fPIC" \
                ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Package libraries
        run: |
          mkdir -p dist/lib
          find build -name "*.so*" -type f -exec cp {} dist/lib/ \;
          ls -lh dist/lib/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librocketmq-ubuntu-amd64
          path: dist/lib/
          retention-days: 30

  build-arm64:
    name: Build Ubuntu arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            crossbuild-essential-arm64 \
            qemu-user-static || true

      - name: Add ARM64 architecture
        run: |
          sudo dpkg --add-architecture arm64 || true
          sudo apt-get update || true

      - name: Install ARM64 dependencies
        run: |
          sudo apt-get install -y \
            libssl-dev:arm64 \
            libcurl4-openssl-dev:arm64 \
            libapr1-dev:arm64 \
            libaprutil1-dev:arm64 \
            libboost-all-dev || true

      - name: Build jsoncpp (arm64)
        run: |
          mkdir -p jsoncpp-build
          cd jsoncpp-build
          git clone https://github.com/open-source-parsers/jsoncpp.git . || true
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DJSONCPP_WITH_TESTS=OFF \
                -DJSONCPP_WITH_EXAMPLE=OFF \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG" \
                ..
          make -j$(nproc) || true
          mkdir -p ../../bin/lib ../../bin/include/jsoncpp
          find . -name "libjsoncpp.a" -exec cp {} ../../bin/lib/ \; 2>/dev/null || true
          find ../include -name "*.h" -exec cp {} ../../bin/include/jsoncpp/ \; 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build

      - name: Configure with CMake (arm64)
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_ROCKETMQ_SHARED=ON \
                -DBUILD_ROCKETMQ_STATIC=OFF \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
                -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -fPIC" \
                -DCMAKE_C_FLAGS="-O3 -DNDEBUG -fPIC" \
                ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Package libraries
        run: |
          mkdir -p dist/lib
          find build -name "*.so*" -type f -exec cp {} dist/lib/ \;
          ls -lh dist/lib/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librocketmq-ubuntu-arm64
          path: dist/lib/
          retention-days: 30

  release:
    name: Create Release with Libraries
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: librocketmq-ubuntu-amd64
          path: release/amd64

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: librocketmq-ubuntu-arm64
          path: release/arm64

      - name: Create tarball packages
        run: |
          cd release
          tar -czf librocketmq-ubuntu-amd64.tar.gz amd64/
          tar -czf librocketmq-ubuntu-arm64.tar.gz arm64/
          ls -lh *.tar.gz
          cd ..

      - name: Get version from tag
        id: tag_name
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_name.outputs.VERSION }}
          name: Release ${{ steps.tag_name.outputs.VERSION }}
          files: |
            release/librocketmq-ubuntu-amd64.tar.gz
            release/librocketmq-ubuntu-arm64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
