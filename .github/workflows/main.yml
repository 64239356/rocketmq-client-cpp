name: Build Multi-Arch Native Libraries

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build-amd64:
    name: Build Ubuntu amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libboost-all-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libapr1-dev \
            libaprutil1-dev

      - name: Build jsoncpp (amd64)
        run: |
          mkdir -p jsoncpp-build
          cd jsoncpp-build
          git clone --depth 1 https://github.com/open-source-parsers/jsoncpp.git . || true
          if [ -f CMakeLists.txt ]; then
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF ..
            make -j$(nproc)
            mkdir -p ../../bin/lib ../../bin/include/jsoncpp
            cp src/lib_json/libjsoncpp.a ../../bin/lib/ 2>/dev/null || true
            cp -r ../include/json ../../bin/include/jsoncpp/ 2>/dev/null || true
          fi

      - name: Create build directory
        run: mkdir -p build

      - name: Configure with CMake (amd64)
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_ROCKETMQ_SHARED=ON \
                -DBUILD_ROCKETMQ_STATIC=OFF \
                ..

      - name: Build (amd64)
        run: |
          cd build
          make -j$(nproc) 2>&1 | head -100

      - name: Package libraries (amd64)
        run: |
          mkdir -p dist/lib
          find build -name "*.so*" -type f -exec cp {} dist/lib/ \; 2>/dev/null || true
          ls -lh dist/lib/ || echo "No libraries found"

      - name: Upload artifacts (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: librocketmq-ubuntu-amd64
          path: dist/lib/
          retention-days: 30

  build-arm64:
    name: Build Ubuntu arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            crossbuild-essential-arm64 \
            qemu-user-static
          
          # Configure ARM64 package sources
          sudo tee /etc/apt/sources.list.d/arm64.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: jammy jammy-updates jammy-security
          Architectures: arm64
          Components: main universe multiverse restricted
          EOF
          
          sudo dpkg --add-architecture arm64
          sudo apt-get update || true
          sudo apt-get install -y \
            libboost-all-dev:arm64 \
            libssl-dev:arm64 \
            libcurl4-openssl-dev:arm64 \
            libapr1-dev:arm64 \
            libaprutil1-dev:arm64 || true

      - name: Build jsoncpp (arm64)
        run: |
          mkdir -p jsoncpp-build
          cd jsoncpp-build
          git clone --depth 1 https://github.com/open-source-parsers/jsoncpp.git . || true
          if [ -f CMakeLists.txt ]; then
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DBUILD_SHARED_LIBS=OFF \
                  -DJSONCPP_WITH_TESTS=OFF \
                  -DCMAKE_SYSTEM_NAME=Linux \
                  -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                  -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                  -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                  -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
                  ../src
            make -j$(nproc)
            mkdir -p ../../bin/lib ../../bin/include/jsoncpp
            cp src/lib_json/libjsoncpp.a ../../bin/lib/ 2>/dev/null || true
            cp -r ../include/json ../../bin/include/jsoncpp/ 2>/dev/null || true
          fi

      - name: Create build directory
        run: mkdir -p build

      - name: Configure with CMake (arm64)
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_ROCKETMQ_SHARED=ON \
                -DBUILD_ROCKETMQ_STATIC=OFF \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG" \
                -DCMAKE_C_FLAGS="-O3 -DNDEBUG" \
                -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
                ..

      - name: Build (arm64)
        run: |
          cd build
          make -j$(nproc) 2>&1 | head -100

      - name: Package libraries (arm64)
        run: |
          mkdir -p dist/lib
          find build -name "*.so*" -type f -exec cp {} dist/lib/ \; 2>/dev/null || true
          ls -lh dist/lib/ || echo "No libraries found"

      - name: Upload artifacts (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: librocketmq-ubuntu-arm64
          path: dist/lib/
          retention-days: 30

  release:
    name: Create Release with Libraries
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: librocketmq-ubuntu-amd64
          path: release/amd64

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: librocketmq-ubuntu-arm64
          path: release/arm64

      - name: Create tarball packages
        run: |
          mkdir -p release
          cd release
          tar -czf librocketmq-ubuntu-amd64.tar.gz amd64/ 2>/dev/null || true
          tar -czf librocketmq-ubuntu-arm64.tar.gz arm64/ 2>/dev/null || true
          ls -lh *.tar.gz 2>/dev/null || echo "No tarballs created"
          cd ..

      - name: Get version from tag
        id: tag_name
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_name.outputs.VERSION }}
          name: Release ${{ steps.tag_name.outputs.VERSION }}
          files: |
            release/librocketmq-ubuntu-amd64.tar.gz
            release/librocketmq-ubuntu-arm64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
