name: Multi-Arch Build (AMD64 & ARM64)

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build RocketMQ CPP Client (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4小时全局超时
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            timeout: 60          # AMD64: 60分钟
          - arch: arm64
            platform: linux/arm64
            timeout: 180         # ARM64: 180分钟（3倍）
      max-parallel: 1  # 顺序构建，避免资源竞争

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Display System Info
        run: |
          echo "=== Build Configuration ==="
          echo "Architecture: ${{ matrix.arch }}"
          echo "Platform: ${{ matrix.platform }}"
          echo "Timeout: ${{ matrix.timeout }} minutes"
          echo ""
          echo "=== Host System Info ==="
          uname -a
          df -h
          free -h

      - name: Build with Docker
        timeout-minutes: ${{ matrix.timeout }}
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            --memory=2g \
            --memory-swap=2g \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:20.04 bash -c "
              set -e
              
              echo '=== Installing dependencies ==='
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                build-essential cmake git libtool autoconf automake \
                pkg-config libz-dev libssl-dev libncurses5-dev curl \
                wget python3 bzip2 tar unzip
              
              echo '=== System Information ==='
              uname -a
              nproc
              free -h
              df -h
              gcc --version | head -1
              
              echo '=== Building RocketMQ Client CPP ==='
              echo 'Start time:' \$(date)
              chmod +x build.sh
              
              # 使用 noVerbose 降低内存占用
              timeout ${{ matrix.timeout }}m bash build.sh noVerbose || {
                EXIT_CODE=\$?
                echo 'Build failed with exit code:' \$EXIT_CODE
                if [ -f tmp_build_dir/buildclient.txt ]; then
                  echo '=== Last 100 lines of build log ==='
                  tail -n 100 tmp_build_dir/buildclient.txt
                fi
                exit \$EXIT_CODE
              }
              
              echo 'End time:' \$(date)
              echo '=== Build Complete ==='
              if [ -d bin ]; then
                ls -lh bin/ | head -20
                du -sh bin/
              fi
            "

      - name: Collect Build Logs on Failure
        if: failure()
        run: |
          mkdir -p build-logs
          find . -maxdepth 3 -name "*build*.txt" -o -name "*config*.txt" | \
            xargs -I {} cp {} build-logs/ 2>/dev/null || true
          ls -lh build-logs/ 2>/dev/null || echo "No logs collected"

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build-logs/
          retention-days: 7

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocketmq-client-cpp-${{ matrix.arch }}
          path: bin/
          retention-days: 30

      - name: Generate Build Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Build Summary
          - **Architecture**: ${{ matrix.arch }}
          - **Status**: ${{ job.status }}
          - **Timeout**: ${{ matrix.timeout }} minutes
          - **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          ### Performance Notes
          **AMD64**: Full parallel compilation (60 min)
          **ARM64**: QEMU emulation + memory limits (180 min)
          - Memory limit: 2GB
          - Parallel jobs: Auto-reduced
          - Boost: Limited to 2 threads
          EOF
