name: Multi-Arch Build (AMD64 & ARM64)

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build RocketMQ CPP Client (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Display System Info
        run: |
          echo "=== Build Configuration ==="
          echo "Architecture: ${{ matrix.arch }}"
          echo "Platform: ${{ matrix.platform }}"
          echo "Workspace: ${{ github.workspace }}"

      - name: Build with Docker
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:20.04 bash -c "
              set -e
              
              echo '=== Installing dependencies ==='
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                cmake \
                git \
                libtool \
                autoconf \
                automake \
                pkg-config \
                libz-dev \
                libssl-dev \
                libncurses5-dev \
                curl \
                wget \
                python3 \
                bzip2 \
                tar \
                unzip
              
              echo '=== System Information ==='
              uname -a
              gcc --version
              cmake --version
              
              echo '=== Building RocketMQ Client CPP ==='
              chmod +x build.sh
              bash build.sh
              
              echo '=== Build Complete ==='
              ls -lh bin/ || echo 'No bin directory found'
            "

      - name: List Build Artifacts
        if: always()
        run: |
          echo "=== Build Artifacts for ${{ matrix.arch }} ==="
          ls -lh bin/ 2>/dev/null || echo "No artifacts found"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocketmq-client-cpp-${{ matrix.arch }}
          path: bin/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate Build Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Build Summary
          - **Architecture**: ${{ matrix.arch }}
          - **Status**: ${{ job.status }}
          - **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          EOF
