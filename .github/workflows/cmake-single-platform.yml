name: Multi-Arch Build (x64 & ARM64)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 设置矩阵，分别构建 amd64 (x64) 和 arm64
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 为 ARM64 构建准备 QEMU 模拟器
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      # 使用 Docker 容器进行构建，确保环境纯净且易于切换架构
      - name: Build in Container
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:20.04 /bin/bash -c "
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential cmake git libtool autoconf automake \
                pkg-config libz-dev libssl-dev libncurses5-dev \
                curl wget python3 bzip2 && \
              # 执行 RocketMQ Client 的构建脚本
              # build.sh 会自动处理 boost, libevent, jsoncpp
              sh build.sh
            "

      # 上传构建产物 (bin 目录下通常包含 librocketmq.so 和 .a)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocketmq-client-${{ matrix.arch }}
          path: bin/
