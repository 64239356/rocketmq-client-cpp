name: Build Ubuntu Multi-Architecture (AMD64 & ARM64)

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'develop'
        type: string
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        default: true
        type: boolean
  # PR 触发
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '**.java'
      - 'pom.xml'
      - '.github/workflows/build-ubuntu-multiarch.yml'

env:
  MAVEN_OPTS: -Xmx4g -Xms1g -XX:MaxMetaspaceSize=512m

jobs:
  # 构建 AMD64 版本
  build-amd64:
    name: Build Ubuntu AMD64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (Skip Tests)
        run: |
          mvn -B clean package -DskipTests --file pom.xml
          echo "Build completed for AMD64"

      - name: Prepare distribution package
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mkdir -p dist/amd64
          cp -r distribution/target/rocketmq-${VERSION}/* dist/amd64/ 2>/dev/null || \
            cp -r distribution/target/* dist/amd64/ 2>/dev/null || \
            find . -name "rocketmq*.zip" -exec cp {} dist/amd64/ \;
          ls -la dist/amd64/

      - name: Upload AMD64 artifacts
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: rocketmq-ubuntu-amd64
          path: dist/amd64/
          retention-days: 7

  # 构建 ARM64 版本
  build-arm64:
    name: Build Ubuntu ARM64
    runs-on: ubuntu-24.04-arm  # GitHub 提供的 ARM64 Runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-arm64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-maven-

      - name: Build with Maven (Skip Tests)
        run: |
          mvn -B clean package -DskipTests --file pom.xml
          echo "Build completed for ARM64"

      - name: Prepare distribution package
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mkdir -p dist/arm64
          cp -r distribution/target/rocketmq-${VERSION}/* dist/arm64/ 2>/dev/null || \
            cp -r distribution/target/* dist/arm64/ 2>/dev/null || \
            find . -name "rocketmq*.zip" -exec cp {} dist/arm64/ \;
          ls -la dist/arm64/

      - name: Upload ARM64 artifacts
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: rocketmq-ubuntu-arm64
          path: dist/arm64/
          retention-days: 7

  # 创建 Release（仅在手动触发时）
  create-release:
    name: Create Release
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_artifacts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AMD64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: rocketmq-ubuntu-amd64
          path: dist/amd64/

      - name: Download ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: rocketmq-ubuntu-arm64
          path: dist/arm64/

      - name: Create distribution archives
        run: |
          VERSION=$(date +%Y%m%d)-${{ github.run_number }}
          mkdir -p release
          
          # 打包 AMD64
          cd dist/amd64
          zip -r ../../release/rocketmq-${VERSION}-ubuntu-amd64.zip .
          cd ../..
          
          # 打包 ARM64
          cd dist/arm64
          zip -r ../../release/rocketmq-${VERSION}-ubuntu-arm64.zip .
          cd ../..
          
          ls -la release/

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: rocketmq-ubuntu-multiarch-release
          path: release/
          retention-days: 30

      - name: Create GitHub Release (optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 构建状态汇总
  build-summary:
    name: Build Summary
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Status
        run: |
          echo "## RocketMQ Ubuntu Multi-Architecture Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| AMD64 | ${{ needs.build-amd64.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ARM64 | ${{ needs.build-arm64.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
